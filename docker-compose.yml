services:

  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── PostgREST (REST API sobre o PostgreSQL) ───────────────────
  rest:
    image: postgrest/postgrest:v12.2.0
    environment:
      PGRST_DB_URI:            postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS:        public
      PGRST_DB_ANON_ROLE:      anon
      PGRST_JWT_SECRET:        super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # ── nginx (gateway — expõe /rest/v1/ → PostgREST) ────────────
  gateway:
    image: nginx:1.25-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rest

  # ── Next.js (frontend + API routes) ──────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Supabase local — URL interna do Docker (só server-side no app)
      NEXT_PUBLIC_SUPABASE_URL:              http://gateway:8000
      # Anon key padrão do Supabase demo (role: anon, exp: 2032)
      # assinada com o JWT_SECRET acima
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:  eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRFA0NiK7W9oNBkdZDBpCtQgxnNGanNd7-DecFJDpwY
      # OpenAI — passe via .env ou export na shell
      OPENAI_API_KEY:  ${OPENAI_API_KEY}
      OPENAI_MODEL:    ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - .:/app
      - /app/node_modules   # preserva node_modules do container
      - /app/.next          # preserva cache de build do container
    depends_on:
      - gateway

volumes:
  db_data:
